<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กระดานราคาตลาดโลก</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ตลาดโลก">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#14231f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--panel:#fff;--ink:#14231f;--mute:#62736d;--line:#dbe2df;--up:#0b8a4b;--down:#c8372d;--gold:#b8860b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1815;--panel:#16231f;--ink:#e7efec;--mute:#8fa39b;--line:#25362f;--up:#3ddc84;--down:#ff6b5e;--gold:#e0b84a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif}
header{max-width:1180px;margin:0 auto;padding:28px 20px 8px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h1{font-size:26px;margin:0;font-weight:700;display:flex;align-items:center;gap:12px}
h1 img{width:44px;height:44px}
#stamp{color:var(--mute);font-size:13px}
main{max-width:1180px;margin:0 auto;padding:12px 20px 48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 16px 10px}
section.gold{border-color:var(--gold)}
h2{font-size:15px;font-weight:700;margin:12px 0 4px}
.row{display:grid;grid-template-columns:1fr auto 70px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.n small{display:block;color:var(--mute);font-size:12px}
.p{text-align:right;font-variant-numeric:tabular-nums}
.p b{display:block;font-weight:500;font-size:16px}
.up{color:var(--up)}.down{color:var(--down)}
svg{width:70px;height:26px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:first-of-type{border-top:0}
.note{color:var(--mute);font-size:12px;margin:6px 0 2px}
</style>
</head>
<body>
<header><h1><img src="assets/logo.png" alt="" width="44" height="44">กระดานราคาตลาดโลก</h1><div id="stamp">กำลังโหลด…</div></header>
<main id="app"></main>
<script>
const f=(n,d=2)=>n==null?"–":n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const baht=s=>s==null?"–":(typeof s==="number"?f(s,0):s);
function spark(a,cls){
  if(!a||a.length<2)return"";
  const mn=Math.min(...a),mx=Math.max(...a),w=70,h=26;
  const pts=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-2-(v-mn)/((mx-mn)||1)*(h-4)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" class="${cls}"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;
}
function row(r){
  if(r.price==null)return `<div class="row"><div class="n">${r.name}<small>${r.symbol}</small></div><div class="p">ไม่มีข้อมูล</div><div></div></div>`;
  const c=r.change>=0?"up":"down",s=r.change>=0?"+":"";
  return `<div class="row"><div class="n">${r.name}<small>${r.symbol} · ${r.asof}</small></div>
  <div class="p"><b>${f(r.price)}</b><span class="${c}">${s}${f(r.change)} (${s}${f(r.pct)}%)</span></div>
  <div class="${c}">${spark(r.spark,c)}</div></div>`;
}
function goldCard(g){
  if(!g)return"";
  const kv=(k,v)=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`;
  return `<section class="gold"><h2>ทองคำไทย (บาท/บาททองคำ)</h2>
  ${kv("ทองคำแท่ง รับซื้อ",baht(g.bar_buy))}${kv("ทองคำแท่ง ขายออก",baht(g.bar_sell))}
  ${kv("ทองรูปพรรณ รับซื้อ",baht(g.orn_buy))}${kv("ทองรูปพรรณ ขายออก",baht(g.orn_sell))}
  ${g.theory_bar?kv("ราคาคำนวณจากทองโลก × USD/THB "+g.usdthb,baht(g.theory_bar)):""}
  <div class="note">${g.source?`ที่มา: ${g.source} · อัปเดต ${g.updated||""}`:"ดึงราคาทองไทยไม่สำเร็จ แสดงเฉพาะราคาคำนวณ"}</div></section>`;
}
async function load(){
  try{
    const d=await (await fetch("data/data.json?t="+Date.now())).json();
    document.getElementById("stamp").textContent="อัปเดตล่าสุด "+new Date(d.updated).toLocaleString("th-TH",{timeZone:"Asia/Bangkok"})+" (เวลาไทย) · ราคาอาจล่าช้า 15–20 นาที";
    let html=d.groups.map(g=>`<section><h2>${g.title}</h2>${g.rows.map(row).join("")}</section>`).join("");
    html+=goldCard(d.thai_gold);
    document.getElementById("app").innerHTML=html;
  }catch(e){document.getElementById("stamp").textContent="โหลดข้อมูลไม่สำเร็จ: ยังไม่มี data/data.json ให้รัน workflow ก่อน";}
}
load();setInterval(load,300000);
</script>
</body>
</html>
